name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Generates the API from openapi.yaml, compiles, and runs unit + Testcontainers
      # integration tests (Docker is available on GitHub-hosted Ubuntu runners).
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log

      # Surface the useful lines as annotations so failures are readable on the
      # run summary and pull requests without downloading logs.
      - name: Report build errors
        if: failure()
        run: |
          annotate() {
            local title="$1"; shift
            local body
            body=$(cat | head -c 60000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$body" ]; then echo "::error title=${title}::${body}"; fi
            return 0
          }
          grep -E '^\[ERROR\]' build.log | grep -v -E 'Re-run Maven|^\[ERROR\] *$|-> \[Help|To see the full stack' | head -60 \
            | annotate "Maven errors"
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -q -E 'FAILURE|ERROR' "$f" && head -80 "$f" | annotate "$(basename "$f" .txt)"
          done
          grep -h -A 25 -E 'APPLICATION FAILED TO START|Caused by:|Unhandled exception' target/surefire-reports/*-output.txt 2>/dev/null \
            | head -80 | annotate "Spring context failure" || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/
            build.log

  # The cashier register UI: generates TypeScript types from openapi.yaml, type-checks
  # against them and builds. A contract change the UI doesn't handle fails here.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          body=$( (grep -E 'error|Error|ERR!' build.log || tail -40 build.log) | head -60 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Web build errors::${body}"

  # The whole stack from compose.yaml: builds the images, starts everything, checks the
  # register and API through the gateway, then runs 500 simulated registers against it.
  stack:
    needs: [build, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Smoke test through the gateway
        run: |
          set -e
          base=http://localhost:8080
          curl -fsS $base/ | grep -q '<div id="root">'
          curl -fsS $base/v1/health
          menu="$base/v1/locations/5b1f6a2e-8c1d-4f3a-9e7b-2d4c6a8e0f11/menu-items?available=true"
          # Without a session the API refuses...
          test "$(curl -s -o /dev/null -w '%{http_code}' "$menu")" = 401
          # ...and without the CSRF header sign-in is refused too.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
            -d '{"employeeId":"C2001","pin":"1111"}' $base/v1/auth/login)" = 403
          # Sign in like the register: the HttpOnly cookie goes in the jar.
          curl -fsS -c cookies.txt -X POST -H 'Content-Type: application/json' -H 'X-Kiosk-Register: 1' \
            -d '{"employeeId":"C2001","pin":"1111"}' $base/v1/auth/login | grep -q '"role":"CASHIER"'
          grep -q 'kiosk_session' cookies.txt
          curl -fsS -b cookies.txt "$menu" | grep -q 'Soft Pretzel'
          echo "API replicas running: $(docker compose ps api --status running -q | wc -l)"

      - name: Browser walkthrough with screenshots
        working-directory: e2e
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          node register-walkthrough.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: register-screenshots
          path: e2e/screenshots/
          if-no-files-found: ignore

      - name: Load test (500 registers)
        run: |
          chmod 777 load/results
          docker compose --profile loadtest run --rm -e DURATION=2m k6

      - name: Publish load test results
        if: always()
        run: |
          if [ -f load/results/summary.txt ]; then
            { echo '## Load test: 500 registers'; echo '```'; cat load/results/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            body=$(sed -e 's/%/%25/g' load/results/summary.txt | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::notice title=Load test results::${body}"
          fi

      - name: Report stack errors
        if: failure()
        run: |
          docker compose ps -a
          logs=$(docker compose logs --no-color --tail=150 2>&1 | grep -iE 'error|exception|fatal|refused|failed' | head -60 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$logs" ] && echo "::error title=Stack logs::${logs}" || true
          state=$(docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Container states::${state}"

      - name: Upload load test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-test-results
          path: load/results/
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose --profile loadtest down -v
