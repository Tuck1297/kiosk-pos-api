name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Generates the API from openapi.yaml, compiles, and runs unit + Testcontainers
      # integration tests (Docker is available on GitHub-hosted Ubuntu runners).
      - name: Build and test
        run: |
          set -o pipefail
          mvn -B -ntp verify 2>&1 | tee build.log

      # Surface the useful lines as annotations so failures are readable on the
      # run summary and pull requests without downloading logs.
      - name: Report build errors
        if: failure()
        run: |
          annotate() {
            local title="$1"; shift
            local body
            body=$(cat | head -c 60000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            if [ -n "$body" ]; then echo "::error title=${title}::${body}"; fi
            return 0
          }
          grep -E '^\[ERROR\]' build.log | grep -v -E 'Re-run Maven|^\[ERROR\] *$|-> \[Help|To see the full stack' | head -60 \
            | annotate "Maven errors"
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -q -E 'FAILURE|ERROR' "$f" && head -80 "$f" | annotate "$(basename "$f" .txt)"
          done
          grep -h -A 25 -E 'APPLICATION FAILED TO START|Caused by:|Unhandled exception' target/surefire-reports/*-output.txt 2>/dev/null \
            | head -80 | annotate "Spring context failure" || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            target/surefire-reports/
            build.log
