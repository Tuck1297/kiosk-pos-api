# Gateway: serves the register UI and load-balances /v1 across every API replica.

# Docker's embedded DNS. Re-resolve "api" every 5s so new or removed replicas
# (docker compose up --scale api=N) are picked up automatically.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream api {
    zone api_upstream 64k;
    # Send each request to the replica with the fewest in-flight requests.
    least_conn;
    server api:8080 resolve max_fails=3 fail_timeout=10s;
    # Reuse connections to the replicas instead of opening one per request.
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /v1/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        # Only GETs are retried on another replica. POSTs (orders, payments) are not,
        # because the register retries them itself with the same Idempotency-Key.
        proxy_next_upstream error timeout http_502 http_503;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change; cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path serves index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
