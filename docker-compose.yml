services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiosk_pos
      POSTGRES_USER: kiosk
      POSTGRES_PASSWORD: kiosk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiosk -d kiosk_pos"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
