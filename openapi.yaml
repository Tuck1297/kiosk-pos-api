openapi: 3.1.0
info:
  title: Kiosk POS API
  version: 1.0.0
  summary: Order and payment API for a theme-park food and merchandise kiosk.
  description: |
    Contract-first API for a point-of-sale system used by mobile ordering apps
    and staff terminals at quick-service kiosks.

    ## Conventions
    - **Money** is always an integer in minor units (`amountCents`) plus an ISO 4217
      `currency`. Never floats.
    - **Tax** is computed once on the order subtotal using the location's tax rate
      (`rateBps`, from the tax rate table), rounded half-up to the cent.
    - **Prices are snapshotted** onto order lines when an order is created, so later
      menu price changes never alter an existing order.
    - **Idempotency**: every `POST` that creates or charges something requires an
      `Idempotency-Key` header (a client-generated UUID). Retrying with the same key
      and same body replays the original response; the same key with a different
      body returns `422`. A second request arriving while the first is still running
      returns `409` with code `IDEMPOTENCY_IN_PROGRESS`.
    - **Concurrency**: orders carry a `version`. State-changing calls on an order send
      it back in `If-Match`; a stale version returns `412`.
    - **Errors** use RFC 9457 `application/problem+json`.
    - **Pagination** is cursor-based: pass `nextCursor` from the previous page as `cursor`.

    ## Authentication
    Staff sign in with `POST /auth/login` (employee ID + PIN). The response sets a
    `kiosk_session` cookie that is `HttpOnly` (unreadable by JavaScript) and
    `SameSite=Strict`; browsers send it automatically. Every endpoint except
    `/health` and `/auth/login` returns `401` without a valid session.

    **CSRF protection:** every `POST`, `PUT`, `PATCH` and `DELETE` must also send the
    header `X-Kiosk-Register: 1`. A cross-site form can't set custom headers, so a
    request without it is refused with `403 CSRF_HEADER_MISSING`.

    ## Validation
    Request bodies are checked twice before any business logic runs: first against
    this schema, then by the server's request guards (rules that span fields, such as
    "card payments need `cardToken`"). Failures return `400 VALIDATION_FAILED` with an
    `errors` list naming each field.

    ## Order lifecycle
    `OPEN` → `PAID` → `IN_PREPARATION` → `READY` → `COMPLETED`
    `OPEN` or `PAID` → `CANCELLED` (a paid order is voided on cancel)
    An `OPEN` order comped to $0.00 moves straight to `PAID`.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080/v1
    description: Local (Docker Compose)

security:
  - sessionCookie: []

tags:
  - name: Auth
    description: Staff sign-in with an HTTP-only session cookie.
  - name: Locations
    description: Kiosks and the parks they belong to.
  - name: Menu
    description: Items a location sells and whether they are available right now.
  - name: Orders
    description: Create, track and update guest orders.
  - name: Payments
    description: Take payment for an order (card is mocked).
  - name: Health
    description: Liveness for load balancers and Docker.

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in at a register
      description: |
        Checks the employee ID and PIN and sets the `kiosk_session` cookie. Five wrong
        PINs in a row lock the account for 15 minutes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. The session cookie is in `Set-Cookie`.
          headers:
            Set-Cookie:
              description: '`kiosk_session=...; Path=/v1; HttpOnly; SameSite=Strict; Max-Age=43200` (plus `Secure` over HTTPS)'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Unknown employee ID or wrong PIN (deliberately not saying which).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/AccountLocked'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out
      # Error responses are problem+json like everywhere else, but are described without a
      # media type here: the success response has no body, and listing only
      # application/problem+json would make the server refuse clients that accept JSON.
      responses:
        '204':
          description: Signed out; the cookie is cleared.
        '401':
          description: Not signed in (problem+json).
        '403':
          description: Missing the X-Kiosk-Register header (problem+json).

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentStaff
      summary: Who is signed in at this register
      responses:
        '200':
          description: The signed-in staff member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Staff'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness check
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /locations:
    get:
      tags: [Locations]
      operationId: listLocations
      summary: List kiosk locations
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of locations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /locations/{locationId}:
    parameters:
      - $ref: '#/components/parameters/LocationId'
    get:
      tags: [Locations]
      operationId: getLocation
      summary: Get one location
      responses:
        '200':
          description: The location.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Location'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /locations/{locationId}/menu-items:
    get:
      tags: [Menu]
      operationId: listMenuItems
      summary: List a location's menu
      parameters:
        - $ref: '#/components/parameters/LocationId'
        - name: available
          in: query
          description: When true, only items that can be ordered right now.
          schema:
            type: boolean
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/MenuCategory'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of menu items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Menu]
      operationId: createMenuItem
      summary: Add an item to a location's menu (staff)
      parameters:
        - $ref: '#/components/parameters/LocationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuItemRequest'
      responses:
        '201':
          description: Created.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: A menu item with this SKU already exists at the location.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /menu-items/{menuItemId}:
    parameters:
      - $ref: '#/components/parameters/MenuItemId'
    patch:
      tags: [Menu]
      operationId: updateMenuItem
      summary: Change price or availability (staff)
      description: Marking an item unavailable (e.g. sold out) stops new orders for it. Existing orders keep their snapshotted price.
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateMenuItemRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order
      description: |
        Prices the order exactly like `POST /orders/quote` (every item must be sold and
        available at `locationId`), snapshots prices and the tax rate onto the order,
        and assigns a pickup number. Clients never send prices or totals.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
            example:
              locationId: 5b1f6a2e-8c1d-4f3a-9e7b-2d4c6a8e0f11
              channel: MOBILE
              guestName: Jordan
              lines:
                - menuItemId: 9a3e7c51-2b4d-4e6f-8a1c-3d5e7f9b1c22
                  quantity: 2
                - menuItemId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e33
                  quantity: 1
                  note: no ice
      responses:
        '201':
          description: Order created in `OPEN` status.
          headers:
            Location:
              $ref: '#/components/headers/Location'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: One or more items are unavailable or belong to another location.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://kiosk-pos.example.com/problems/item-unavailable
                title: Item unavailable
                status: 409
                detail: Frozen Lemonade is sold out at this location.
                code: ITEM_UNAVAILABLE
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders (staff order queue)
      parameters:
        - name: locationId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Repeat to filter on several statuses, e.g. `status=PAID&status=IN_PREPARATION`.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OrderStatus'
          style: form
          explode: true
        - name: createdAfter
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of orders, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/quote:
    post:
      tags: [Orders]
      operationId: quoteOrder
      summary: Price a basket without creating an order
      description: |
        The register sends only menu item ids and quantities; the server returns every
        price, line total, the tax rate, tax and total. Nothing is stored. Use it to show
        the cashier and guest the amount due before creating the order.

        `POST /orders` recomputes the same numbers itself, so a quote is never trusted
        as input.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            example:
              locationId: 5b1f6a2e-8c1d-4f3a-9e7b-2d4c6a8e0f11
              lines:
                - menuItemId: 9a3e7c51-2b4d-4e6f-8a1c-3d5e7f9b1c22
                  quantity: 2
                - menuItemId: 1c2d3e4f-5a6b-4c7d-8e9f-0a1b2c3d4e33
                  quantity: 1
                  note: no ice
      responses:
        '200':
          description: The priced basket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderQuote'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: An item is sold out or not sold at this location, or the location is closed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://kiosk-pos.example.com/problems/item-unavailable
                title: Item unavailable
                status: 409
                detail: Churro is sold out.
                code: ITEM_UNAVAILABLE

  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      responses:
        '200':
          description: The order.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    put:
      tags: [Orders]
      operationId: updateOrderStatus
      summary: Move a paid order through preparation (staff)
      description: |
        Allowed transitions: `PAID`→`IN_PREPARATION`→`READY`→`COMPLETED`.
        Use `POST /orders/{orderId}/cancel` to cancel and `POST /orders/{orderId}/payments` to pay.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Status changed.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '412':
          $ref: '#/components/responses/StaleVersion'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: Cancel an order
      description: Allowed from `OPEN` or `PAID`. A captured payment is voided in the same transaction.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          description: Order cancelled.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '412':
          $ref: '#/components/responses/StaleVersion'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '428':
          $ref: '#/components/responses/PreconditionRequired'

  /orders/{orderId}/comps:
    post:
      tags: [Orders]
      operationId: compOrder
      summary: Comp an item or the whole order (manager approval)
      description: |
        Takes one line, or everything not yet comped, off an `OPEN` order. Needs a
        manager's employee ID and PIN even when a cashier is the one signed in, so a
        cashier can't approve their own comp. Tax is recomputed on the reduced subtotal. If the
        total reaches $0.00 the order moves to `PAID` with nothing to collect.

        Every comp is recorded with the approving manager, the signed-in staff member who
        asked, the reason and the amount.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompRequest'
            example:
              orderLineId: 3f1e2d3c-4b5a-4c6d-8e7f-9a0b1c2d3e4f
              reason: QUALITY_ISSUE
              note: Pretzel was cold
              managerEmployeeId: M1001
              managerPin: '2468'
      responses:
        '201':
          description: Comp applied. The updated order, with its new version in `ETag`.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Manager ID or PIN not accepted, or the ID is not a manager's.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The order isn't open, or the item or order is already comped.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          $ref: '#/components/responses/StaleVersion'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '423':
          $ref: '#/components/responses/AccountLocked'

  /orders/{orderId}/payments:
    post:
      tags: [Payments]
      operationId: payOrder
      summary: Pay for an order
      description: |
        Charges the order's full total, as computed by the server. On success the order
        moves to `PAID`. For cash, the server computes `changeDue`; for an amount below
        the total it returns `400 INSUFFICIENT_CASH`.

        The card processor is mocked: a `cardToken` starting with `tok_decline` is
        declined (`tok_decline_insufficient_funds_0002` declines with code
        `insufficient_funds`); anything else is approved. Trailing digits become `cardLast4`.

        A declined attempt is recorded and the same `Idempotency-Key` will replay the
        decline, so retry with a new key. The database allows only one captured payment
        per order, so a guest can never be charged twice.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
            examples:
              card:
                value:
                  tenderType: CARD
                  cardToken: tok_visa_4242
              cash:
                value:
                  tenderType: CASH
                  cashTenderedCents: 2000
      responses:
        '201':
          description: Payment captured; order is now `PAID`.
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          description: Card declined. The order stays `OPEN` and can be retried with a new key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: https://kiosk-pos.example.com/problems/payment-declined
                title: Payment declined
                status: 402
                code: PAYMENT_DECLINED
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '412':
          $ref: '#/components/responses/StaleVersion'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
    get:
      tags: [Payments]
      operationId: listOrderPayments
      summary: List payment attempts for an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: All attempts, including declines and voids, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: kiosk_session
      description: |
        Set by `POST /auth/login`. HttpOnly, SameSite=Strict, Path=/v1, valid for one
        shift (12 hours). Signed by the server, so any API replica can check it without
        a lookup.

  parameters:
    LocationId:
      name: locationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MenuItemId:
      name: menuItemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, unique per logical operation. Kept for 24 hours.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The order's current `ETag` (its `version`, quoted), e.g. `"3"`.
      schema:
        type: string
        example: '"3"'

  headers:
    Location:
      description: URL of the created resource.
      schema:
        type: string
        format: uri-reference
    ETag:
      description: The order's current version, quoted. Send it back in `If-Match`.
      schema:
        type: string
        example: '"3"'

  responses:
    ValidationFailed:
      description: The request body or parameters are invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://kiosk-pos.example.com/problems/validation
            title: Validation failed
            status: 400
            code: VALIDATION_FAILED
            errors:
              - field: lines[0].quantity
                message: must be between 1 and 20
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token's role is not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidTransition:
      description: The order is not in a status that allows this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://kiosk-pos.example.com/problems/invalid-transition
            title: Invalid status transition
            status: 409
            detail: Cannot move order from OPEN to READY.
            code: INVALID_TRANSITION
    StaleVersion:
      description: '`If-Match` does not match the current version. Re-fetch and retry.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PreconditionRequired:
      description: The `If-Match` header is missing.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AccountLocked:
      description: Too many wrong PINs; the account is locked for 15 minutes.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://kiosk-pos.example.com/problems/account-locked
            title: Account locked
            status: 423
            code: ACCOUNT_LOCKED
    IdempotencyKeyReused:
      description: This `Idempotency-Key` was already used with a different request body.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://kiosk-pos.example.com/problems/idempotency-key-reused
            title: Idempotency key reused
            status: 422
            code: IDEMPOTENCY_KEY_REUSED

  schemas:
    Money:
      type: object
      required: [amountCents, currency]
      properties:
        amountCents:
          type: integer
          format: int64
          minimum: 0
          example: 650
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD

    Location:
      type: object
      required: [id, name, parkCode, timezone, taxRate, currency, active]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          example: Lakeside Snack Stand
        parkCode:
          type: string
          description: Short code for the park or area the kiosk sits in.
          example: LAKE
        timezone:
          type: string
          example: America/New_York
        taxRate:
          $ref: '#/components/schemas/TaxRate'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD
        active:
          type: boolean

    TaxRate:
      type: object
      description: A sales tax rate shared by every location in its jurisdiction.
      required: [id, code, name, rateBps]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: PARK-STD
        name:
          type: string
          example: Park standard sales tax
        rateBps:
          type: integer
          description: Basis points (650 = 6.50%).
          minimum: 0
          maximum: 3000
          example: 650

    MenuCategory:
      type: string
      enum: [ENTREE, SNACK, DESSERT, BEVERAGE, MERCHANDISE]

    MenuItem:
      type: object
      required: [id, locationId, sku, name, category, price, available]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        locationId:
          type: string
          format: uuid
        sku:
          type: string
          example: BEV-LEM-FRZ
        name:
          type: string
          example: Frozen Lemonade
        description:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/MenuCategory'
        price:
          $ref: '#/components/schemas/Money'
        available:
          type: boolean
          description: False when sold out or temporarily off the menu.
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    CreateMenuItemRequest:
      type: object
      required: [sku, name, category, priceCents]
      additionalProperties: false
      properties:
        sku:
          type: string
          pattern: '^[A-Z0-9-]{3,32}$'
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 500
        category:
          $ref: '#/components/schemas/MenuCategory'
        priceCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000
        available:
          type: boolean
          default: true

    UpdateMenuItemRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: [string, 'null']
          maxLength: 500
        priceCents:
          type: integer
          format: int64
          minimum: 0
          maximum: 100000
        available:
          type: boolean

    OrderStatus:
      type: string
      enum: [OPEN, PAID, IN_PREPARATION, READY, COMPLETED, CANCELLED]

    OrderChannel:
      type: string
      enum: [MOBILE, KIOSK, COUNTER]

    QuoteRequest:
      type: object
      required: [locationId, lines]
      additionalProperties: false
      properties:
        locationId:
          type: string
          format: uuid
        lines:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/OrderLineRequest'

    QuoteLine:
      type: object
      required: [menuItemId, sku, name, quantity, unitPrice, lineTotal]
      properties:
        menuItemId:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
        note:
          type: [string, 'null']

    OrderQuote:
      type: object
      description: Server-computed prices for a basket. Not stored.
      required: [locationId, lines, subtotal, taxRate, tax, total, pricedAt]
      properties:
        locationId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/QuoteLine'
        subtotal:
          $ref: '#/components/schemas/Money'
        taxRate:
          $ref: '#/components/schemas/TaxRate'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        pricedAt:
          type: string
          format: date-time

    CreateOrderRequest:
      type: object
      required: [locationId, channel, lines]
      additionalProperties: false
      properties:
        locationId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/OrderChannel'
        guestName:
          type: string
          maxLength: 40
          description: Name to call out when the order is ready.
        lines:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/OrderLineRequest'

    OrderLineRequest:
      type: object
      required: [menuItemId, quantity]
      additionalProperties: false
      properties:
        menuItemId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 20
        note:
          type: string
          maxLength: 120

    OrderLine:
      type: object
      required: [id, menuItemId, sku, name, quantity, unitPrice, lineTotal]
      properties:
        id:
          type: string
          format: uuid
        menuItemId:
          type: string
          format: uuid
        sku:
          type: string
          description: Snapshot at order time.
        name:
          type: string
          description: Snapshot at order time.
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
        note:
          type: [string, 'null']
        comped:
          type: boolean
          description: True when this line has been comped on its own.

    Order:
      type: object
      required: [id, orderNumber, locationId, channel, status, lines, subtotal, compTotal, comps, taxRateBps, tax, total, version, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: integer
          description: Short number shown to the guest and called out at pickup.
          example: 1042
        locationId:
          type: string
          format: uuid
        channel:
          $ref: '#/components/schemas/OrderChannel'
        guestName:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/OrderStatus'
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        subtotal:
          $ref: '#/components/schemas/Money'
        compTotal:
          $ref: '#/components/schemas/Money'
        comps:
          type: array
          items:
            $ref: '#/components/schemas/Comp'
        tax:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        createdBy:
          $ref: '#/components/schemas/StaffRef'
        cancelReason:
          type: [string, 'null']
        taxRateBps:
          type: integer
          description: The tax rate this order was priced with, in basis points. Later rate changes don't affect it.
        version:
          type: integer
          description: Increments on every change. Also returned as `ETag`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StaffRole:
      type: string
      enum: [CASHIER, MANAGER]

    Staff:
      type: object
      required: [id, employeeId, name, role]
      properties:
        id:
          type: string
          format: uuid
        employeeId:
          type: string
          example: C2001
        name:
          type: string
          example: Alex P.
        role:
          $ref: '#/components/schemas/StaffRole'

    StaffRef:
      type: object
      required: [employeeId, name]
      properties:
        employeeId:
          type: string
        name:
          type: string

    LoginRequest:
      type: object
      required: [employeeId, pin]
      additionalProperties: false
      properties:
        employeeId:
          type: string
          pattern: '^[A-Z0-9-]{2,16}$'
        pin:
          type: string
          format: password
          pattern: '^[0-9]{4,6}$'

    CompReason:
      type: string
      enum: [GUEST_RECOVERY, WRONG_ORDER, QUALITY_ISSUE, EMPLOYEE_MEAL, OTHER]

    CompRequest:
      type: object
      description: Omit `orderLineId` to comp everything on the order not yet comped. `note` is required when `reason` is `OTHER`.
      required: [reason, managerEmployeeId, managerPin]
      additionalProperties: false
      properties:
        orderLineId:
          type: string
          format: uuid
        reason:
          $ref: '#/components/schemas/CompReason'
        note:
          type: string
          maxLength: 200
        managerEmployeeId:
          type: string
          pattern: '^[A-Z0-9-]{2,16}$'
        managerPin:
          type: string
          format: password
          pattern: '^[0-9]{4,6}$'

    Comp:
      type: object
      required: [id, reason, amount, approvedBy, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orderLineId:
          type: string
          format: uuid
          description: Absent (or null) for a whole-order comp.
        reason:
          $ref: '#/components/schemas/CompReason'
        note:
          type: [string, 'null']
        amount:
          $ref: '#/components/schemas/Money'
        approvedBy:
          $ref: '#/components/schemas/StaffRef'
        requestedBy:
          $ref: '#/components/schemas/StaffRef'
        createdAt:
          type: string
          format: date-time

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [IN_PREPARATION, READY, COMPLETED]

    TenderType:
      type: string
      enum: [CARD, CASH]

    CreatePaymentRequest:
      type: object
      description: |
        `cardToken` is required for `CARD`; `cashTenderedCents` is required for `CASH`.
        The server rejects any other combination with `400 VALIDATION_FAILED`.
      required: [tenderType]
      additionalProperties: false
      properties:
        tenderType:
          $ref: '#/components/schemas/TenderType'
        cardToken:
          type: string
          description: Required when `tenderType` is `CARD`. Mock processor token.
          minLength: 4
          maxLength: 64
        cashTenderedCents:
          type: integer
          format: int64
          minimum: 0
          description: Required when `tenderType` is `CASH`. Must be at least the order total.

    CancelOrderRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 200

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]

    PaymentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'

    PaymentStatus:
      type: string
      enum: [CAPTURED, DECLINED, VOIDED]

    Payment:
      type: object
      required: [id, orderId, tenderType, status, amount, createdAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        tenderType:
          $ref: '#/components/schemas/TenderType'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          $ref: '#/components/schemas/Money'
        changeDue:
          $ref: '#/components/schemas/Money'
          description: Cash payments only; omitted for card.
        cardLast4:
          type: [string, 'null']
          pattern: '^[0-9]{4}$'
        processorReference:
          type: [string, 'null']
          description: Reference from the (mock) processor.
        declineCode:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time

    PageInfo:
      type: object
      required: [nextCursor]
      properties:
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.

    LocationPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Location'

    MenuItemPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MenuItem'

    OrderPage:
      allOf:
        - $ref: '#/components/schemas/PageInfo'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Order'

    Problem:
      type: object
      description: RFC 9457 problem details, plus a stable machine-readable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: Stable code clients can switch on.
          enum:
            - VALIDATION_FAILED
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - DUPLICATE_SKU
            - ITEM_UNAVAILABLE
            - LOCATION_CLOSED
            - INVALID_CREDENTIALS
            - ACCOUNT_LOCKED
            - CSRF_HEADER_MISSING
            - MANAGER_APPROVAL_FAILED
            - COMP_NOT_ALLOWED
            - INVALID_TRANSITION
            - STALE_VERSION
            - PRECONDITION_REQUIRED
            - PAYMENT_DECLINED
            - INSUFFICIENT_CASH
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_IN_PROGRESS
            - INTERNAL_ERROR
        errors:
          type: array
          description: Field-level details for `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
