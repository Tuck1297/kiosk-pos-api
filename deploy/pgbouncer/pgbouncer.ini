; PgBouncer between the API replicas and Postgres.
;
; Each API replica keeps its own connection pool (DB_POOL_SIZE). Without PgBouncer, every
; replica you add costs Postgres more real connections (and memory); with it, any number
; of replicas share a fixed set of server connections, released after each transaction.

[databases]
kiosk_pos = host=postgres port=5432 dbname=kiosk_pos

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; A server connection is borrowed per transaction, not per client session.
pool_mode = transaction
; Client side: up to 100 API replicas x 20 pooled connections.
max_client_conn = 2000
; Server side: real Postgres connections per database/user pair.
default_pool_size = 40
min_pool_size = 10
reserve_pool_size = 10
reserve_pool_timeout = 2
server_reset_query =

; Sent by the Postgres JDBC driver at connect; harmless to ignore.
ignore_startup_parameters = extra_float_digits,options

admin_users = kiosk
stats_users = kiosk
